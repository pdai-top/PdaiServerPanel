name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o "dist/pdai-${{ matrix.suffix }}" .

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="pdai-${VERSION}-${{ matrix.suffix }}"
          mkdir -p "${RELEASE_DIR}"
          cp "dist/pdai-${{ matrix.suffix }}" "${RELEASE_DIR}/pdai"
          cp README.MD LICENSE NOTICE "${RELEASE_DIR}/"
          tar -czf "${RELEASE_DIR}.tar.gz" "${RELEASE_DIR}"
          sha256sum "${RELEASE_DIR}.tar.gz" > "${RELEASE_DIR}.tar.gz.sha256"

      - name: Write release notes
        run: |
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            pdai-*-${{ matrix.suffix }}.tar.gz
            pdai-*-${{ matrix.suffix }}.tar.gz.sha256

      - name: Sync release body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('release-notes.md', 'utf8')
            const { owner, repo } = context.repo
            const tag = context.ref.replace('refs/tags/', '')
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body,
            })
